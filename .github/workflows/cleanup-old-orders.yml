name: Cleanup Old Orders

on:
  schedule:
    # Runs every day at 00:00 UTC
    # = 5:30 AM India Standard Time
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Run old order cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl.exe -X POST \
            "https://fastdelivery-x0ce.onrender.com/api/maintenance/cleanup-old-orders" \
            -H "x-cron-secret: $CRON_SECRET"